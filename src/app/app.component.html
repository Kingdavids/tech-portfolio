<app-scroll-progress></app-scroll-progress>
<app-cursor></app-cursor>
<app-nav></app-nav>

<main>
  <section id="home" class="section-hero" appScrollReveal>
    <app-hero></app-hero>
  </section>

  <section id="about" class="section" appScrollReveal>
    <span class="section-number" [appParallax]="0.1">01</span>
    <span class="eyebrow">// 01 — About</span>
    <h2 appScramble>About</h2>
    <app-about></app-about>
  </section>

  <section id="experience" class="section" appScrollReveal>
    <span class="section-number" [appParallax]="0.1">02</span>
    <span class="eyebrow">// 02 — Experience</span>
    <h2 appScramble>Experience</h2>
    <app-experience></app-experience>
  </section>

  <section id="work" class="section" appScrollReveal>
    <span class="section-number" [appParallax]="0.1">03</span>
    <span class="eyebrow">// 03 — Work</span>
    <h2 appScramble>Work</h2>
    <app-work></app-work>
  </section>

  <section id="contact" class="section" appScrollReveal>
    <span class="section-number" [appParallax]="0.1">04</span>
    <span class="eyebrow">// 04 — Contact</span>
    <h2 appScramble>Let's build something</h2>
    <app-contacts></app-contacts>
  </section>
</main>

<app-footer></app-footer>

<div class="theme-controls">
  <button class="scroll-top" (click)="scrollToTop()" title="Back to top">↑</button>
</div>
