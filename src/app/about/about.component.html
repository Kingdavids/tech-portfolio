<div class="about-split">
  <div class="about-photo-col">
    <div class="profile-section glass-card">
      <div class="profile-flip-container">
        <img [src]="currentPicture" class="profile-image" alt="Profile picture">
      </div>
      <p class="profile-caption">Full-stack developer &amp; lifelong builder, based in Ontario, Canada.</p>
    </div>

    <div class="glass-card skills-card">
      <h3>Skills</h3>
      <div class="skills-chips">
        <span class="skill-chip" *ngFor="let skill of info.skills">{{ skill }}</span>
      </div>
    </div>
  </div>

  <div class="about-content-col">
    <div class="glass-card bio-card" *ngFor="let paragraph of bioParagraphs">
      <p>{{paragraph}}</p>
    </div>
  </div>
</div>
