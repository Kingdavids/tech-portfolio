<div
  class="cursor-dot"
  [class.visible]="isVisible"
  [class.hover]="isHovering"
  [style.transform]="'translate(' + x + 'px, ' + y + 'px)'"
></div>
<div
  class="cursor-ring"
  [class.visible]="isVisible"
  [class.hover]="isHovering"
  [style.transform]="'translate(' + x + 'px, ' + y + 'px)'"
></div>
